<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intelligent Meeting Platform | Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] } } } }
    </script>
    <style>
        body { background-color: #020617; color: #f1f5f9; }
        .glass { background: rgba(30, 41, 59, 0.5); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body class="min-h-screen">

<nav class="glass sticky top-0 z-50 border-b border-slate-800 px-6 py-4 flex items-center justify-between">
    <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center"><i class="fa-solid fa-brain"></i></div>
        <span class="text-xl font-bold bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">InsightMeeting</span>
    </div>
    <div class="flex items-center gap-6 text-sm font-medium">
        <a href="#" class="text-indigo-400">Dashboard</a>
        <a href="#" class="text-slate-400 hover:text-white">Meetings</a>
        <a href="#" class="text-slate-400 hover:text-white">Analytics</a>
        <button onclick="toggleModal()" class="bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded-full transition-all text-xs font-bold uppercase tracking-wider">New Action</button>
    </div>
</nav>

<main class="p-6 max-w-7xl mx-auto">
    <header class="mb-8">
        <h1 class="text-3xl font-bold text-white mb-2">Executive Overview</h1>
        <p class="text-slate-400">Real-time risk monitoring and action tracking infrastructure.</p>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
        <div class="glass p-6 rounded-2xl border-l-4 border-indigo-500">
            <h3 class="text-slate-400 text-sm">Open Action Items</h3>
            <p class="text-3xl font-bold mt-2">24</p>
        </div>
        <div class="glass p-6 rounded-2xl border-l-4 border-amber-500">
            <h3 class="text-slate-400 text-sm">Risk Detected</h3>
            <p class="text-3xl font-bold mt-2">3 <span class="text-sm font-normal text-amber-500">High Priority</span></p>
        </div>
        <div class="glass p-6 rounded-2xl border-l-4 border-emerald-500">
            <h3 class="text-slate-400 text-sm">Completion Rate</h3>
            <p class="text-3xl font-bold mt-2">88%</p>
        </div>
    </div>

    <div class="glass rounded-2xl overflow-hidden">
        <table class="w-full text-left">
            <thead class="bg-slate-900/50">
                <tr>
                    <th class="p-4 text-xs font-bold text-slate-400 uppercase tracking-widest">Title</th>
                    <th class="p-4 text-xs font-bold text-slate-400 uppercase tracking-widest">Owner</th>
                    <th class="p-4 text-xs font-bold text-slate-400 uppercase tracking-widest">Due Date</th>
                    <th class="p-4 text-xs font-bold text-slate-400 uppercase tracking-widest">Status</th>
                    <th class="p-4 text-xs font-bold text-slate-400 uppercase tracking-widest">Action</th>
                </tr>
            </thead>
            <tbody id="actionTable" class="divide-y divide-slate-800">
                <!-- Rows injected by JS -->
            </tbody>
        </table>
    </div>
</main>

<div id="modal" class="fixed inset-0 bg-black/80 hidden items-center justify-center z-50">
    <div class="glass p-8 rounded-2xl w-full max-w-lg shadow-2xl">
        <h2 class="text-xl font-bold mb-6">Create New Action Item</h2>
        <form id="actionForm" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-400 mb-1">TITLE</label>
                <input type="text" id="title" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 outline-none focus:border-indigo-500">
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-1">OWNER EMAIL</label>
                    <input type="email" id="email" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-1">PRIORITY</label>
                    <select id="priority" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 outline-none">
                        <option>Critical</option>
                        <option>High</option>
                        <option>Medium</option>
                    </select>
                </div>
            </div>
            <div class="flex gap-4 mt-6">
                <button type="button" onclick="toggleModal()" class="flex-1 border border-slate-700 py-3 rounded-lg hover:bg-slate-800">Cancel</button>
                <button type="submit" class="flex-1 bg-indigo-600 py-3 rounded-lg hover:bg-indigo-500 font-bold">Submit Action</button>
            </div>
        </form>
    </div>
</div>

<script>
    const actions = [
        { title: "Finalize Q4 Budget", owner: "jane@company.com", due: "2023-12-31", status: "OPEN" },
        { title: "Security Audit Patch", owner: "dev@company.com", due: "2023-11-15", status: "IN_PROGRESS" }
    ];

    const renderTable = () => {
        const tbody = document.getElementById('actionTable');
        tbody.innerHTML = actions.map(a => `
            <tr class="hover:bg-slate-800/30 transition-colors">
                <td class="p-4 font-semibold">${a.title}</td>
                <td class="p-4 text-slate-400 text-sm">${a.owner}</td>
                <td class="p-4 text-slate-400 text-sm">${a.due}</td>
                <td class="p-4"><span class="px-2 py-1 rounded bg-slate-800 text-[10px] font-bold">${a.status}</span></td>
                <td class="p-4"><button class="text-indigo-400 hover:text-white"><i class="fa-solid fa-chevron-right"></i></button></td>
            </tr>
        `).join('');
    };

    const toggleModal = () => document.getElementById('modal').classList.toggle('hidden');

    document.getElementById('actionForm').onsubmit = (e) => {
        e.preventDefault();
        const newAction = {
            title: document.getElementById('title').value,
            owner: document.getElementById('email').value,
            due: '2023-12-31',
            status: 'OPEN'
        };
        actions.push(newAction);
        renderTable();
        toggleModal();
        alert('API POST /api/v1/actions successful: act-9988');
    };

    renderTable();
</script>
</body>
</html>
