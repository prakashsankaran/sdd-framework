<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VMS | Secure Visitor Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { slate: { 950: '#020617' } } } }
        }
    </script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #020617; }
        .glass { background: rgba(30, 41, 59, 0.4); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .glow { box-shadow: 0 0 15px rgba(59, 130, 246, 0.2); }
    </style>
</head>
<body class="text-slate-200">

    <nav class="glass fixed w-full top-0 z-50 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center"><i class="fas fa-shield-halved"></i></div>
            <span class="font-bold text-lg tracking-tight">VMS <span class="text-blue-500 font-light">Pro</span></span>
        </div>
        <div class="flex items-center gap-6 text-sm font-medium">
            <span class="text-blue-400">Receptionist Console</span>
            <div class="w-8 h-8 rounded-full bg-slate-700 flex items-center justify-center"><i class="fas fa-user"></i></div>
        </div>
    </nav>

    <main class="pt-24 px-6 pb-12 max-w-7xl mx-auto">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- Registration Form -->
            <div class="lg:col-span-1 space-y-6">
                <div class="glass p-6 rounded-2xl">
                    <h2 class="text-xl font-semibold mb-6 flex items-center gap-2"><i class="fas fa-user-plus text-blue-500"></i> New Check-In</h2>
                    <form id="checkInForm" class="space-y-4">
                        <div>
                            <label class="text-xs text-slate-400 uppercase tracking-wider">Visitor Name</label>
                            <input type="text" id="vName" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 mt-1 focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                        </div>
                        <div>
                            <label class="text-xs text-slate-400 uppercase tracking-wider">Mobile Number</label>
                            <input type="tel" id="vMobile" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 mt-1 focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="text-xs text-slate-400 uppercase tracking-wider">Employee Host</label>
                            <select id="vEmp" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 mt-1 outline-none">
                                <option>Sarah Jenkins (Dev)</option>
                                <option>Mark Ross (Ops)</option>
                            </select>
                        </div>
                        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 py-3 rounded-lg font-bold transition-all glow">Process Registration</button>
                    </form>
                </div>
            </div>

            <!-- Visitor Table -->
            <div class="lg:col-span-2 glass rounded-2xl p-6">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-semibold">Active Visitors</h2>
                    <input type="text" id="search" placeholder="Search logs..." class="bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-sm outline-none">
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead>
                            <tr class="text-slate-400 text-xs uppercase border-b border-slate-700">
                                <th class="pb-3">Name</th>
                                <th class="pb-3">Host</th>
                                <th class="pb-3">Check-In</th>
                                <th class="pb-3">Status</th>
                            </tr>
                        </thead>
                        <tbody id="visitorTable" class="text-sm">
                            <!-- JS Injection -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script>
        const visitors = [
            { id: 1, name: 'John Doe', emp: 'Sarah Jenkins', time: '10:45 AM', status: 'Checked-In' },
            { id: 2, name: 'Alice Smith', emp: 'Mark Ross', time: '09:20 AM', status: 'Checked-In' }
        ];

        function renderTable() {
            const container = document.getElementById('visitorTable');
            container.innerHTML = visitors.map(v => `
                <tr class="border-b border-slate-800 hover:bg-slate-800/50 transition-colors">
                    <td class="py-4 font-semibold">${v.name}</td>
                    <td class="py-4 text-slate-400">${v.emp}</td>
                    <td class="py-4 text-slate-400">${v.time}</td>
                    <td class="py-4"><span class="px-2 py-1 bg-green-500/10 text-green-400 rounded-full text-xs">${v.status}</span></td>
                </tr>
            `).join('');
        }

        document.getElementById('checkInForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('vName').value;
            if(!name) return alert('Input required');
            
            // Mock API Flow
            visitors.push({ id: Date.now(), name, emp: 'TBD', time: new Date().toLocaleTimeString(), status: 'Checked-In' });
            renderTable();
            e.target.reset();
            alert('POST /api/visitors/check-in successful. Notification dispatched.');
        });

        renderTable();
    </script>
</body>
</html>
